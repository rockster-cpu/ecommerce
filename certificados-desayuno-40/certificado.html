<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Reconocimiento Ponentes · Opción Clásica</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  /* Tamaño carta horizontal (11 x 8.5 in = 1056 x 816 px) */
  @page { size: 11in 8.5in; margin: 0; }
  :root { --navy: #0b1f4d; --navy-2: #163a7d; --gold: #a97a26; --gold-2: #d9b25c; --ink: #2a2a35; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #e9e4da; }
  body { -webkit-print-color-adjust: exact; print-color-adjust: exact; font-variant-numeric: lining-nums; }
  svg text { font-variant-numeric: lining-nums; }

  .page {
    position: relative; width: 1056px; height: 816px; overflow: hidden;
    background: radial-gradient(ellipse at 50% 45%, #fffdf8 0%, #fcf7ea 65%, #f6eedb 100%);
    break-after: page;
  }
  .page:last-child { break-after: auto; }
  @media screen { .page { margin: 24px auto; box-shadow: 0 6px 30px rgba(0,0,0,.18); } }
  .art { position: absolute; inset: 0; }
  .abs { position: absolute; }
  .c { left: 0; right: 0; text-align: center; }

  .logo { top: 86px; left: 50%; transform: translateX(-50%); height: 94px; }
  .title {
    top: 196px; font-family: 'Playfair Display', serif; font-weight: 800;
    font-size: 52px; letter-spacing: 11px; padding-left: 11px; line-height: 1; color: var(--navy);
  }
  .event {
    top: 259px; display: flex; justify-content: center; align-items: center; gap: 12px;
    font-family: 'Cinzel', serif; font-weight: 700; font-size: 14.5px; letter-spacing: 3px; color: var(--navy-2);
  }
  .event .script { font-family: 'Parisienne', cursive; font-weight: 400; font-size: 29px; letter-spacing: 0; color: var(--gold); margin-top: -4px; }
  .event .rule { width: 60px; height: 1.5px; background: linear-gradient(90deg, transparent, var(--gold)); }
  .event .rule.r { transform: scaleX(-1); }
  .granted { top: 304px; font-family: 'Montserrat', sans-serif; font-weight: 600; font-size: 11px; letter-spacing: 4.5px; color: var(--gold); }
  .namebox { top: 318px; left: 50%; transform: translateX(-50%); width: 660px; text-align: center; }
  .name { font-family: 'Great Vibes', cursive; font-size: 78px; line-height: 1.15; color: var(--navy); white-space: nowrap; min-height: 90px; }
  .flourish { display: block; margin: -2px auto 0; width: 520px; height: 18px; }
  .text {
    top: 438px; left: 50%; transform: translateX(-50%); width: 680px; text-align: center;
    font-family: 'Montserrat', sans-serif; font-size: 13.5px; line-height: 1.65; color: var(--ink);
  }
  .text b { font-weight: 600; color: var(--navy); }
  .text em { font-family: 'Playfair Display', serif; font-style: italic; font-weight: 500; font-size: 14.8px; color: var(--navy); }
  .stats {
    top: 528px; display: flex; justify-content: center; align-items: center; gap: 12px;
    font-family: 'Cinzel', serif; font-weight: 700; font-size: 10px; letter-spacing: 2px; color: var(--gold);
  }
  .stats i { width: 4px; height: 4px; transform: rotate(45deg); background: var(--gold-2); }

  .block { width: 250px; text-align: center; }
  .block .line { border-top: 1.2px solid var(--navy); margin-bottom: 7px; }
  .block .big { font-family: 'Playfair Display', serif; font-weight: 700; font-size: 16.5px; color: var(--navy); }
  .block .small { font-family: 'Montserrat', sans-serif; font-size: 10px; color: var(--ink); margin-top: 2px; line-height: 1.45; }
  .block .ec { font-family: 'Montserrat', sans-serif; font-weight: 600; font-size: 9.5px; letter-spacing: 1.1px; color: var(--gold); margin-top: 3px; }
  .date { left: 132px; top: 650px; }
  .sign { right: 132px; top: 650px; }
  .seal { left: 50%; transform: translateX(-50%); top: 580px; width: 122px; }
  .badge { top: 98px; right: 112px; width: 84px; }
</style>
</head>
<body>
<div id="out"></div>
<script src="nombres.js"></script>
<script src="comun.js"></script>
<script>
  const W = 1056, H = 816;
  // Marco con grabado guilloché (se calcula una sola vez)
  const o = 34, b = 28;            // margen exterior y grosor de la banda azul
  const bandaH = G.banda(W - 2 * (o + b) - 8, 17, 46, 5);
  const bandaV = G.banda(H - 2 * (o + b) - 8, 17, 34, 5);
  const ros = G.roseta(15.5, 2, 14, 5) + G.espiro(11, 4.2, 6, 5);
  const marca = G.roseta(250, 9, 48, 9) + G.roseta(200, 7, 40, 7) + G.espiro(150, 54, 82, 27);
  const esq = [[o + b / 2, o + b / 2], [W - o - b / 2, o + b / 2], [o + b / 2, H - o - b / 2], [W - o - b / 2, H - o - b / 2]];

  const marco = `
  <svg class="art" viewBox="0 0 ${W} ${H}">
    <path d="${marca}" transform="translate(${W / 2} ${H / 2 + 20})" fill="none" stroke="#c9a14f" stroke-width=".5" opacity=".13"/>
    <rect x="${o + b / 2}" y="${o + b / 2}" width="${W - 2 * o - b}" height="${H - 2 * o - b}" fill="none" stroke="#0d2357" stroke-width="${b}"/>
    <rect x="${o + .5}" y="${o + .5}" width="${W - 2 * o - 1}" height="${H - 2 * o - 1}" fill="none" stroke="url(#gGold)" stroke-width="1.6"/>
    <rect x="${o + b - .5}" y="${o + b - .5}" width="${W - 2 * (o + b) + 1}" height="${H - 2 * (o + b) + 1}" fill="none" stroke="url(#gGold)" stroke-width="1.6"/>
    <g fill="none" stroke="#d9b25c" stroke-width=".55">
      <path d="${bandaH}" transform="translate(${o + b + 4} ${o + b / 2})"/>
      <path d="${bandaH}" transform="translate(${o + b + 4} ${H - o - b / 2})"/>
      <path d="${bandaV}" transform="translate(${o + b / 2} ${o + b + 4}) rotate(90)"/>
      <path d="${bandaV}" transform="translate(${W - o - b / 2} ${o + b + 4}) rotate(90)"/>
    </g>
    ${esq.map(([x, y]) => `
      
      <circle cx="${x}" cy="${y}" r="19" fill="url(#gNavyR)" stroke="url(#gGold)" stroke-width="1.6"/>
      <path d="${ros}" transform="translate(${x} ${y})" fill="none" stroke="#e2bf6c" stroke-width=".5"/>`).join('')}
    <rect x="${o + b + 9}" y="${o + b + 9}" width="${W - 2 * (o + b + 9)}" height="${H - 2 * (o + b + 9)}" fill="none" stroke="#b8862f" stroke-width="1.2"/>
    <rect x="${o + b + 13}" y="${o + b + 13}" width="${W - 2 * (o + b + 13)}" height="${H - 2 * (o + b + 13)}" fill="none" stroke="#d9b25c" stroke-width=".5"/>
  </svg>`;

  armar((nombre, i) => `
  <section class="page">
    ${marco}
    <img class="abs logo" src="img/logo-oleda.png" alt="Oleda life coach">
    <div class="abs badge">${insignia('ed' + i)}</div>

    <div class="abs c title">RECONOCIMIENTO</div>
    <div class="abs c event"><span class="rule"></span><span>DESAYUNO EMPRESARIAL</span><span class="script">con Propósito</span><span class="rule r"></span></div>

    <div class="abs c granted">SE OTORGA EL PRESENTE A</div>
    <div class="abs namebox">
      <div class="name" data-name>${nombre}</div>
      <svg class="flourish" viewBox="0 0 540 18" preserveAspectRatio="none">
        <path d="M0 9 H236 M304 9 H540" stroke="url(#gGoldH)" stroke-width="1.4"/>
        <path d="M270 1 L279 9 L270 17 L261 9 Z" fill="url(#gGold)"/>
        <circle cx="248" cy="9" r="2.6" fill="#c99a3f"/><circle cx="292" cy="9" r="2.6" fill="#c99a3f"/>
      </svg>
    </div>

    <p class="abs text">
      Por su valiosa participación como <b>Ponente</b> en el <b>Desayuno Empresarial con Propósito,
      Edición #40</b> <em>“Celebra la Vida”</em>, compartiendo su experiencia, conocimiento e historia
      para inspirar el crecimiento personal y empresarial de cada asistente.
    </p>
    <div class="abs c stats"><span>59 años de Oleda</span><i></i><span>4 años de Desayunos</span><i></i><span>9 años de Reinventarse</span></div>

    <div class="abs block date">
      <div class="line"></div>
      <div class="big">17 de octubre de 2026</div>
      <div class="small">La Mansión Restaurant<br>Insurgentes, Ciudad de México</div>
    </div>
    <div class="abs seal">${sello('se' + i, true)}</div>
    <div class="abs block sign">
      <div class="line"></div>
      <div class="big">Oleda Maldonado</div>
      <div class="small">Life Coach · Organizadora</div>
      <div class="ec">ESTÁNDAR DE COMPETENCIA EC0217.01</div>
    </div>
  </section>`, 78);
</script>
</body>
</html>
