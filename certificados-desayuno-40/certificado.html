<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Reconocimiento Ponentes · Desayuno Empresarial #40</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  /* ====== Tamaño carta horizontal (11 x 8.5 in) ====== */
  @page { size: 11in 8.5in; margin: 0; }
  :root {
    --navy: #0b1f4d;
    --navy-2: #13306e;
    --blue: #1d5fbf;
    --gold: #b8862f;
    --gold-2: #d9b25c;
    --gold-3: #f1dc9e;
    --ink: #2a2a35;
    --ivory: #fffbf2;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #e9e4da; }
  body { -webkit-print-color-adjust: exact; print-color-adjust: exact; font-variant-numeric: lining-nums; }
  svg text { font-variant-numeric: lining-nums; }

  .page {
    position: relative;
    width: 11in; height: 8.5in;
    overflow: hidden;
    background:
      radial-gradient(ellipse at 12% 18%, rgba(241,220,158,.35), transparent 40%),
      radial-gradient(ellipse at 88% 82%, rgba(241,220,158,.35), transparent 40%),
      radial-gradient(ellipse at 50% 45%, #fffdf8 0%, var(--ivory) 60%, #fbf3e2 100%);
    page-break-after: always;
    break-after: page;
    margin: 0 auto;
  }
  .page:last-child { page-break-after: auto; break-after: auto; }
  @media screen { .page { margin: 24px auto; box-shadow: 0 6px 30px rgba(0,0,0,.18); } }

  /* Marco: queda dentro del área imprimible de cualquier impresora */
  .frame-outer {
    position: absolute; inset: .32in;
    border: .11in solid var(--navy);
  }
  .frame-gold {
    position: absolute; inset: .5in;
    border: 2px solid var(--gold);
  }
  .frame-gold::after {
    content: ""; position: absolute; inset: 5px;
    border: .75px solid var(--gold-2);
  }
  .corner { position: absolute; overflow: hidden; width: 1.25in; height: 1.25in; }
  .corner.tl { top: .43in; left: .43in; }
  .corner.tr { top: .43in; right: .43in; transform: scaleX(-1); }
  .corner.bl { bottom: .43in; left: .43in; transform: scaleY(-1); }
  .corner.br { bottom: .43in; right: .43in; transform: scale(-1,-1); }

  .content {
    position: absolute; inset: .72in .9in .66in;
    display: flex; flex-direction: column; align-items: center;
    text-align: center;
  }

  .logo { height: .86in; margin-top: .04in; }
  .badge { position: absolute; top: .04in; right: .1in; width: 1.02in; }

  .title {
    margin-top: .1in;
    font-family: 'Playfair Display', serif; font-weight: 800;
    font-size: 54px; letter-spacing: 10px; line-height: 1;
    color: var(--navy);
    padding-left: 10px; /* compensa el espaciado de la última letra */
  }
  .event {
    margin-top: 8px;
    display: flex; align-items: center; gap: 12px;
    font-family: 'Cinzel', serif; font-weight: 700;
    font-size: 15px; letter-spacing: 3.2px; color: var(--navy-2);
  }
  .event .script {
    font-family: 'Parisienne', cursive; font-weight: 400;
    font-size: 30px; letter-spacing: 0; color: var(--gold);
    text-transform: none; margin-top: -4px;
  }
  .rule { width: 44px; height: 1.5px; background: linear-gradient(90deg, transparent, var(--gold)); }
  .rule.r { transform: scaleX(-1); }

  .granted {
    margin-top: .34in;
    font-family: 'Montserrat', sans-serif; font-weight: 600;
    font-size: 11.5px; letter-spacing: 4.5px; color: var(--gold);
  }
  .name-wrap { position: relative; margin-top: 2px; width: 7.4in; }
  .name {
    font-family: 'Great Vibes', cursive;
    font-size: 80px; line-height: 1.12; color: var(--navy);
    white-space: nowrap; min-height: 90px;
  }
  .flourish { display: block; margin: -6px auto 0; width: 5.6in; height: 18px; }

  .text {
    margin-top: .22in; max-width: 7.6in;
    font-family: 'Montserrat', sans-serif; font-weight: 400;
    font-size: 14.4px; line-height: 1.65; color: var(--ink);
  }
  .text b { font-weight: 600; color: var(--navy); }
  .text em { font-family: 'Playfair Display', serif; font-style: italic; font-weight: 500; font-size: 15px; color: var(--navy); }

  .stats {
    margin-top: .2in;
    display: flex; align-items: center; gap: 14px;
    font-family: 'Cinzel', serif; font-weight: 700; font-size: 10.5px;
    letter-spacing: 2.2px; color: var(--gold);
  }
  .stats .dot { width: 5px; height: 5px; transform: rotate(45deg); background: var(--gold-2); }

  .footer {
    position: absolute; left: 0; right: 0; bottom: 0;
    display: grid; grid-template-columns: 1fr 1.25fr 1fr; align-items: end;
  }
  .meta {
    text-align: left; padding-left: .25in; padding-bottom: 6px;
    font-family: 'Montserrat', sans-serif; font-size: 10.5px; line-height: 1.55; color: var(--ink);
  }
  .meta .lbl {
    font-family: 'Cinzel', serif; font-weight: 700; font-size: 9.5px;
    letter-spacing: 2px; color: var(--gold); display: block;
  }
  .meta .lbl + span { display: block; margin-bottom: 6px; }
  .sign { text-align: center; }
  .sign .line { width: 2.75in; margin: 0 auto 7px; border-top: 1.2px solid var(--navy); }
  .sign .who { font-family: 'Playfair Display', serif; font-weight: 700; font-size: 17px; color: var(--navy); }
  .sign .role { font-family: 'Montserrat', sans-serif; font-size: 10.5px; color: var(--ink); margin-top: 2px; }
  .sign .ec  { font-family: 'Montserrat', sans-serif; font-weight: 600; font-size: 10px; letter-spacing: 1.2px; color: var(--gold); margin-top: 3px; }
  .seal-wrap { display: flex; justify-content: flex-end; padding-right: .15in; }
  .seal { width: 1.22in; }
</style>
</head>
<body>

<!-- =====================================================
     PARA CAMBIAR LOS NOMBRES, EDITA SOLO ESTA LISTA.
     Se genera una hoja por cada nombre.
     Usa "" (vacío) para una hoja con el nombre en blanco.

  const NOMBRES = [

<!-- Elementos reutilizables (definiciones SVG) -->

    <svg class="corner bl" viewBox="0 0 160 160"><path d="M0 0 H150 C 95 10, 40 30, 0 120 Z" fill="url(#gNavy)" opacity=".96"/><path d="M0 0 H104 C 64 8, 26 26, 0 78 Z" fill="#1a3d86" opacity=".55"/><path d="M0 132 C 38 40, 92 16, 158 4" fill="none" stroke="url(#gGold)" stroke-width="3"/><path d="M0 146 C 45 52, 100 26, 160 16" fill="none" stroke="url(#gGold)" stroke-width="1.2"/></svg>
    <svg class="corner br" viewBox="0 0 160 160"><path d="M0 0 H150 C 95 10, 40 30, 0 120 Z" fill="url(#gNavy)" opacity=".96"/><path d="M0 0 H104 C 64 8, 26 26, 0 78 Z" fill="#1a3d86" opacity=".55"/><path d="M0 132 C 38 40, 92 16, 158 4" fill="none" stroke="url(#gGold)" stroke-width="3"/><path d="M0 146 C 45 52, 100 26, 160 16" fill="none" stroke="url(#gGold)" stroke-width="1.2"/></svg>

    <div class="content">

      </svg>

      <!-- Insignia Edición #40 -->
      <svg class="badge" viewBox="0 0 120 150" aria-label="Edición #40">
        <path d="M38 92 L28 146 L45 134 L56 148 L62 100 Z" fill="url(#gNavy)"/>
        <path d="M82 92 L92 146 L75 134 L64 148 L58 100 Z" fill="url(#gNavy)"/>

        <path d="M82 92 L92 146 L75 134 L64 148 L58 100 Z" fill="none" stroke="url(#gGold)" stroke-width="1.5"/>
        <circle cx="60" cy="58" r="55" fill="url(#gGold)"/>

        <text font-family="Cinzel" font-weight="700" font-size="10.5" letter-spacing="2" fill="#e9c977">

        <text x="60" y="78" text-anchor="middle" font-family="Playfair Display" font-weight="800" font-size="34" fill="url(#gGold)">#40</text>
        <path d="M44 88 Q60 94 76 88" fill="none" stroke="#d9b25c" stroke-width="1.2"/>
      </svg>

      <div class="title">RECONOCIMIENTO</div>
      <div class="event">
        <span class="rule"></span>
        <span>DESAYUNO EMPRESARIAL</span>
        <span class="script">con Propósito</span>
        <span class="rule r"></span>
      </div>

      <div class="granted">SE OTORGA EL PRESENTE A</div>
      <div class="name-wrap">
        <div class="name" data-name></div>
        <svg class="flourish" viewBox="0 0 540 18" preserveAspectRatio="none">

          <path d="M304 9 H540" stroke="url(#gGold)" stroke-width="1.4"/>
          <path d="M270 1 L279 9 L270 17 L261 9 Z" fill="url(#gGold)"/>
          <circle cx="248" cy="9" r="2.6" fill="#c99a3f"/>
          <circle cx="292" cy="9" r="2.6" fill="#c99a3f"/>

      </div>

      <p class="text">
        Por su valiosa participación como <b>Ponente</b> en el <b>Desayuno Empresarial con Propósito,

        para inspirar el crecimiento personal y empresarial de cada asistente.

      <div class="stats">
        <span>59 años de Oleda</span><span class="dot"></span>

      <div class="footer">

        </div>
        <div class="sign">
          <div class="line"></div>
          <div class="who">Oleda Maldonado</div>
          <div class="role">Life Coach · Organizadora</div>
          <div class="ec">ESTÁNDAR DE COMPETENCIA EC0217.01</div>
        </div>
        <div class="seal-wrap">
          <!-- Sello EC0217.01 -->
          <svg class="seal" viewBox="0 0 140 140" aria-label="EC0217.01">
            <circle cx="70" cy="70" r="67" fill="url(#gGold)"/>
            <circle cx="70" cy="70" r="61" fill="url(#gNavy)"/>
            <circle cx="70" cy="70" r="43" fill="none" stroke="#d9b25c" stroke-width="1.2"/>
            <circle cx="70" cy="70" r="40" fill="none" stroke="#d9b25c" stroke-width=".6"/>
            <path id="sealTop" d="M24.9 86.4 A48 48 0 1 1 115.1 86.4" fill="none"/>

            <text font-family="Cinzel" font-weight="700" font-size="8.8" letter-spacing="1.3" fill="#f1dc9e">
              <textPath href="#sealTop" startOffset="50%" text-anchor="middle">ESTÁNDAR DE COMPETENCIA</textPath>

            <text x="70" y="64" text-anchor="middle" font-family="Cinzel" font-weight="700" font-size="11" letter-spacing="2" fill="#f1dc9e">EC</text>
            <text x="70" y="83" text-anchor="middle" font-family="Playfair Display" font-weight="800" font-size="18" fill="url(#gGold)">0217.01</text>
          </svg>
        </div>
      </div>
    </div>
  </section>
</template>

<div id="out"></div>

<script>
  const tpl = document.getElementById('tpl');
  const out = document.getElementById('out');
  // Permite generar un solo nombre con ?nombre=...
  const q = new URLSearchParams(location.search);
  const lista = q.has('nombre') ? [q.get('nombre')] : NOMBRES;

  lista.forEach((nombre, i) => {
    const node = tpl.content.cloneNode(true);
    // ids únicos por hoja para máscaras y trayectos de texto
    node.querySelectorAll('[id]').forEach(el => {
      const old = el.id, nu = old + '_' + i;
      el.id = nu;
      node.querySelectorAll('*').forEach(r => {
        for (const a of ['href', 'mask']) {
          const v = r.getAttribute(a);
          if (v === '#' + old) r.setAttribute(a, '#' + nu);
          if (v === 'url(#' + old + ')') r.setAttribute(a, 'url(#' + nu + ')');
        }
      });
    });
    node.querySelector('[data-name]').textContent = nombre || ' ';
    out.appendChild(node);
  });

  // Ajusta el tamaño del nombre si es muy largo
  document.fonts.ready.then(() => {
    document.querySelectorAll('[data-name]').forEach(el => {
      let size = 80;
      while (el.scrollWidth > el.clientWidth && size > 36) {
        size -= 2; el.style.fontSize = size + 'px';
      }
    });
    document.body.dataset.ready = '1';
  });
</script>
</body>
</html>
